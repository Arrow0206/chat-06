<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>薪水計算器</title>
    <script src="https://static.liff.line.me/21/sdk.js"></script>
    <style>
        :root {
            --primary: #1F497D;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #333333;
            --accent: #385723;
            --accent-bg: #E2EFDA;
            --border: #ddd;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            -webkit-appearance: none;
            background-color: #FAFAFA;
        }

        input:focus {
            background-color: #FFFFFF;
            border-color: var(--primary);
        }

        /* 隱藏手機 input number 的箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .result-box {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-label {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .result-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: #d9534f;
        }

        /* 綠色總計卡片：普通排版，不跑動 */
        .total-card {
            background: var(--accent-bg);
            border-left: 5px solid #4CAF50;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .total-card .card-title {
            color: var(--accent);
            margin-bottom: 5px;
        }

        .total-card .result-label {
            color: var(--accent);
        }

        .total-card .result-value {
            color: #4CAF50;
            font-size: 1.6rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 平台薪水計算器</h2>

    <div class="card">
        <div class="card-title">Timo clob</div>
        <div class="input-group">
            <input type="number" id="timoInput" pattern="[0-9]*" inputmode="numeric" placeholder="請輸入鑽石數量" oninput="calculateSalary()">
        </div>
        <div class="result-box">
            <span class="result-label">薪水答案：</span>
            <span class="result-value" id="timoResult">NT$ 0.00</span>
        </div>
    </div>

    <div class="card">
        <div class="card-title">aTine (聊寓)</div>
        <div class="input-group">
            <input type="number" id="atineInput" pattern="[0-9]*" inputmode="numeric" placeholder="請輸入點數數量" oninput="calculateSalary()">
        </div>
        <div class="result-box">
            <span class="result-label">薪水答案：</span>
            <span class="result-value" id="atineResult">NT$ 0.00</span>
        </div>
    </div>

    <div class="card">
        <div class="card-title">聊天吧</div>
        <div class="input-group">
            <input type="number" id="chatInput" pattern="[0-9]*" inputmode="numeric" placeholder="請輸入點數數量" oninput="calculateSalary()">
        </div>
        <div class="result-box">
            <span class="result-label">薪水答案：</span>
            <span class="result-value" id="chatResult">NT$ 0.00</span>
        </div>
    </div>

    <div class="card">
        <div class="card-title">SUGO</div>
        <div class="input-group">
            <input type="number" id="sugoInput" pattern="[0-9]*" inputmode="numeric" placeholder="請輸入鑽石數量" oninput="calculateSalary()">
        </div>
        <div class="result-box">
            <span class="result-label">薪水答案：</span>
            <span class="result-value" id="sugoResult">NT$ 0.00</span>
        </div>
    </div>

    <div class="card total-card">
        <div class="card-title">💰 所有平台總薪水加總</div>
        <div class="result-box" style="border: none; padding: 0;">
            <span class="result-label">總計實領答案：</span>
            <span class="result-value" id="totalResult">NT$ 0.00</span>
        </div>
    </div>
</div>

<script>
// 網頁載入時自動讀取存檔
document.addEventListener("DOMContentLoaded", function() {
    // 讀取暫存數字
    if(localStorage.getItem('timoData')) document.getElementById('timoInput').value = localStorage.getItem('timoData');
    if(localStorage.getItem('atineData')) document.getElementById('atineInput').value = localStorage.getItem('atineData');
    if(localStorage.getItem('chatData')) document.getElementById('chatInput').value = localStorage.getItem('chatData');
    if(localStorage.getItem('sugoData')) document.getElementById('sugoInput').value = localStorage.getItem('sugoData');
    
    // 讀取完畢後自動跑一次計算
    calculateSalary();

    // 初始化 LINE LIFF
    liff.init({
        liffId: "填入你的LIFF_ID" 
    }).then(() => {
        console.log("LIFF 初始化成功");
    }).catch((err) => {
        console.error("LIFF 初始化失敗", err);
    });
});

function calculateSalary() {
    // 獲取輸入格的數字
    const timo = parseFloat(document.getElementById('timoInput').value) || 0;
    const atine = parseFloat(document.getElementById('atineInput').value) || 0;
    const chat = parseFloat(document.getElementById('chatInput').value) || 0;
    const sugo = parseFloat(document.getElementById('sugoInput').value) || 0;

    // 將數字即時儲存到手機本地暫存
    localStorage.setItem('timoData', document.getElementById('timoInput').value);
    localStorage.setItem('atineData', document.getElementById('atineInput').value);
    localStorage.setItem('chatData', document.getElementById('chatInput').value);
    localStorage.setItem('sugoData', document.getElementById('sugoInput').value);

    // 後台秘密計算公式
    const timoSalary = timo / 600;
    const atineSalary = atine * 1;
    const chatSalary = chat / 5;
    const sugoSalary = (sugo / 5000) * 28;

    // 將四個平台的結果加總
    const totalSalary = timoSalary + atineSalary + chatSalary + sugoSalary;

    // 將結果顯示在畫面上
    document.getElementById('timoResult').innerText = 'NT$ ' + timoSalary.toFixed(2);
    document.getElementById('atineResult').innerText = 'NT$ ' + atineSalary.toFixed(2);
    document.getElementById('chatResult').innerText = 'NT$ ' + chatSalary.toFixed(2);
    document.getElementById('sugoResult').innerText = 'NT$ ' + sugoSalary.toFixed(2);
    document.getElementById('totalResult').innerText = 'NT$ ' + totalSalary.toFixed(2);
}
</script>

</body>
</html>
